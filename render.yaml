services:
  - type: web
    name: deepi-talk
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data/deepi
    disk:
      name: deepi-data
      mountPath: /var/data
      sizeGB: 1
